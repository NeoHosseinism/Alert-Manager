version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alert_manager_postgres
    environment:
      POSTGRES_DB: alert_manager_db
      POSTGRES_USER: alert_manager_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert_manager_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alert_manager_network

  app:
    build: .
    container_name: alert_manager_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: alert_manager_db
      DATABASE_USER: alert_manager_user
      DATABASE_PASSWORD: secure_password
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - alert_manager_network

volumes:
  postgres_data:

networks:
  alert_manager_network:
    driver: bridge
