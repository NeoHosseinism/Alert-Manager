[tool.poetry]
name = "alert-manager"
version = "1.0.0"
description = "Production-Ready IT Infrastructure Monitoring & Alert System"
authors = ["Alert Manager Team <alertmanager@example.com>"]
readme = "README.md"
packages = [{include = "alert_manager", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
python-telegram-bot = "^20.7"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
apscheduler = "^3.10.4"
httpx = "^0.25.2"
structlog = "^24.1.0"
persiantools = "^4.1.1"
cryptography = "^41.0.7"
matplotlib = "^3.8.2"
seaborn = "^0.13.0"
pillow = "^10.1.0"
python-dateutil = "^2.8.2"
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.12.0"
ruff = "^0.1.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=src/alert_manager"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
